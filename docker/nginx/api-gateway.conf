# API Gateway Configuration for Flash Sale System

# Upstream configuration for API replicas
upstream api_backend {
    least_conn;  # Route to instance with fewest active connections

    # Docker service name - will resolve to all replicas
    server api:3000 max_fails=2 fail_timeout=5s;

    # Keep connections alive to reduce latency
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Main API gateway
server {
    listen 80 default_server;
    server_name _;

    # DNS resolver for Docker service discovery
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint (no limits)
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Metrics endpoint (low rate limit, always accessible)
    location /api/metrics {
        # Low rate limit - these should always work
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 503;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fast timeouts for metrics
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_next_upstream off;
    }

    # Status endpoints (low rate limit, always accessible)
    location ~ ^/api/(sales|orders)/ {
        # Low rate limit - read operations should work
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 503;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fast timeouts
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_next_upstream off;
    }

    # Purchase endpoint - HIGH LOAD, relaxed for testing
    location /api/purchases {
        # Relaxed rate limiting for load testing
        # 1000 rps base rate with larger burst to handle spikes
        limit_req zone=purchase_limit burst=200 nodelay;
        limit_req_status 503;

        # Relaxed per-IP limit for localhost testing
        limit_conn addr_conn 50;

        # Server-wide concurrent request limit - increased for testing
        limit_conn server_conn 500;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increased timeouts for load testing
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Don't retry - fail immediately
        proxy_next_upstream off;

        # No buffering for purchases - stream immediately
        proxy_buffering off;
    }

    # Admin endpoints (protected, low limit)
    location /api/admin/ {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 503;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }

    # Catch-all for other API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 503;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_next_upstream off;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cache for HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Error pages - return instant JSON with Retry-After
    error_page 502 503 504 = @backend_error;
    location @backend_error {
        internal;
        default_type application/json;
        add_header Retry-After 1;
        return 503 '{"success":false,"error":"Service at capacity, retry after 1 second","code":"RATE_LIMITED"}';
    }
}
