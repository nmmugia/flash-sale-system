# Main nginx configuration for Flash Sale System

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    # UPDATED: Increased limits for load testing
    # General API: 500 rps (for metrics, status checks, etc)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=500r/s;

    # Purchase endpoint: 1000 rps to allow realistic stress testing
    # In production, tune based on actual backend capacity
    limit_req_zone $binary_remote_addr zone=purchase_limit:10m rate=1000r/s;

    # Connection limiting - relaxed for localhost testing
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    limit_conn_zone $server_name zone=server_conn:10m;

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}
